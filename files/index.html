<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="banner">
        <div class="navbar">
            <img src="../graphics/TripPlannerLogosmall.png" alt="TripPlannerLogo" class="logo">
            <ul>
                <li><a href='#'>Home</a></li>
                <li><a href="#">Impressum</a></li>
            </ul>
        </div>
        <div class="content">
            <h1>START PLANNING YOUR PERFECT TRIP</h1>
            <p>This is where organisation begins.</p>
            <div>
                <!-- "LOG IN" button -->
                <button id="loginButton"><span></span>LOG IN</button>
                
                <!-- "SIGN UP" button -->
                <button id="signupButton"><span></span>SIGN UP</button>
            </div>
        </div>
    </div>

    <!-- JavaScript code to handle the button clicks -->
    <script>
        // Get the "LOG IN" button by its id
        const loginButton = document.getElementById('loginButton');

        // Add a click event listener to the "LOG IN" button
        loginButton.addEventListener('click', function () {
            // Redirect to the login page
            window.location.href = '/login'; // Change this URL to the actual login page URL
        });

        // Get the "SIGN UP" button by its id
        const signupButton = document.getElementById('signupButton');

        // Add a click event listener to the "SIGN UP" button
        signupButton.addEventListener('click', function () {
            // Redirect to the sign-up page
            window.location.href = '/signup'; // Change this URL to the actual sign-up page URL
        });
    </script>
</body>

</html>
