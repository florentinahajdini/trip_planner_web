<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="banner">
        <div class="navbar">
            <img src="../graphics/TripPlannerLogosmall.png" alt="TripPlannerLogo" class="logo">
            <ul>
                <li>
                    <a href="index.html">Home</a></li>
                <li><a href="#">Impressum</a></li>
            </ul>
        </div>
        <div class="loginbox">
            <img class="loginPic" src="/graphics/login.png">
            <h1>Login here</h1>
            <form action="/login" method="POST" onsubmit="return validateForm()">
                <p>Email</p>
                <input type="email" name="email" id="email" placeholder="Enter Email" required>
                <p>Password</p>
                <input type="password" name="password" id="password" placeholder="Enter Password" required>
                <input type="submit" value="Login"><br>
            
            </form>
            
            <form action="/signup" method="GET">
                <a href="/signup">Sign up here</a>
            </form>
        </div>
    </div>

    <script src="client.js"></script>
    <script>
        function validateForm() {
            let name = document.getElementById("name").value; // Change 'email' to 'name'
            let password = document.getElementById("password").value;
    
            if (name === '' || password === '') {
                alert("Please fill in both the username and password fields.");
                return false;
            }
    
            // Send the credentials to the server for authentication
            authenticateUser(name, password);
        }
    
        function authenticateUser(name, password) {
            
            axios.post('/login', {
                name: name, // Change 'email' to 'name'
                password: password
            })
            .then(function(response) {
                var token = response.data.token; // Assuming the server sends the token as 'token' in the response
                // Store the token in localStorage or sessionStorage
                // For example, using localStorage:
                localStorage.setItem('token', token);
    
                // Redirect the user to the authenticated page
                window.location.href = '/authenticated-page';
            })
            .catch(function(error) {
                console.error(error);
                alert('Failed to authenticate. Please check your credentials and try again.');
            });
        }    
    </script>
    
</body>

</html>
