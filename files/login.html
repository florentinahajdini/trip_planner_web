<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="banner">
        <div class="navbar">
            <img src="../graphics/TripPlannerLogosmall.png" alt="TripPlannerLogo" class="logo">
            <ul>
                <li>
                    <a href="index.html">Home</a></li>
                <li><a href="#">Impressum</a></li>
            </ul>
        </div>
        <div class="loginbox">
            <img class="loginPic" src="/graphics/login.png">
            <h1>Login here</h1>
            <form id="loginForm">
                <p>Email</p>
                <input type="email" name="email" id="email" placeholder="Enter Email" required>
                <p>Password</p>
                <input type="password" name="password" id="password" placeholder="Enter Password" required>
                <input type="submit" value="Login"><br>
            
            </form>
            
            <form action="/signup" method="GET">
                <a href="/signup">Sign up here</a>
            </form>
        </div>
    </div>

    <!-- Include Axios library from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();

            const name = document.getElementById("email").value; // Change 'email' to 'name'
            const password = document.getElementById("password").value;
    
            if (name === '' || password === '') {
                alert("Please fill in both the username and password fields.");
                return false;
            }

            axios.post('http://localhost:3003/login', {
                    username: name,
                    password: password
                })
                    .then(function(response) {
                        if (response.status === 200) {
                            window.location.href = response.request.responseURL;
                        } else {
                            alert('Authentication failed. Please check your credentials and try again.');
                        }
                    })
                    .catch(function(error) {
                        console.error(error);
                        alert('Failed to authenticate. Please check your credentials and try again.');
                    });
        });
    </script>
    
</body>

</html>
